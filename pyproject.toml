[project]
name = "oracle"
version = "0.0.1"
description = "ORACLE — personal intelligence agent for business ideas & investments"
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "pydantic",
    "pydantic-settings",
    "python-telegram-bot",
    "yfinance",
    "httpx",
    "feedparser",
    "beautifulsoup4",
    "telethon",
    "youtube-transcript-api",
    "openai",
    "apscheduler>=3.10",
    "langfuse>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle"]
